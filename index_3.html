<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b1f5c">
<title>مصروفي</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly pocket tool, calm and quick — opened ten times a day
   IDEA: a wallet: the money left is the thing, every expense comes out of it
   PICTURE: big remaining balance on a plum card with a draining meter
   COLOUR and TYPE: white, deep plum field, coral accent for spending; Cairo
   LAYOUT: one column, balance card, quick-add form, day-by-day list */
:root{color-scheme:light dark;
--bg:light-dark(#f6f5f8,#0f0d14);--card:light-dark(#fff,#1a1722);--ink:light-dark(#16141c,#f1eef7);
--mute:light-dark(#6c6778,#a49fb2);--line:light-dark(#e6e3ec,#2c2836);
--plum:#3b1f5c;--plum2:#5a3489;--coral:#ff5a4e;--mint:#1f9e6e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,Tahoma,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:20px;margin:4px 0 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
h2{font-size:17px;margin:26px 0 10px;font-weight:800}
.hero{background:linear-gradient(150deg,var(--plum2),var(--plum));color:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 14px 30px -14px #3b1f5c99}
.hero small{opacity:.8;font-size:14px}
.big{font-size:clamp(40px,12vw,56px);font-weight:800;line-height:1.05;margin:4px 0 2px;white-space:nowrap}
.big span{font-size:18px;font-weight:600;opacity:.8}
.meter{height:10px;background:#ffffff2e;border-radius:9px;overflow:hidden;margin:14px 0 6px}
.meter i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
.meter i.low{background:var(--coral)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:#ffffff1a;border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:20px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--mute);font:600 15px Cairo,sans-serif;min-height:40px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
input{width:100%;font:16px Cairo,sans-serif;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px}
input:focus,button:focus-visible{outline:2px solid var(--plum2);outline-offset:2px}
#amt{font-size:26px;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px Cairo,sans-serif;padding:8px 14px;border-radius:99px;min-height:40px;cursor:pointer}
.chips button.on{background:var(--plum);border-color:var(--plum);color:#fff}
.go{width:100%;margin-top:14px;border:0;background:var(--coral);color:#fff;font:800 18px Cairo,sans-serif;min-height:52px;border-radius:14px;cursor:pointer}
.go.in{background:var(--mint)}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Cairo,sans-serif;min-height:40px;padding:0 14px;border-radius:10px;cursor:pointer}
.day{margin-top:14px}
.dayh{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;font-weight:600;padding:0 4px 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin-bottom:6px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.row .t{flex:1}.row .t div{font-weight:600}.row .t small{color:var(--mute)}
.row .a{font-weight:800;white-space:nowrap}
.row .a.out{color:var(--coral)}.row .a.in{color:var(--mint)}
.x{border:0;background:none;color:var(--mute);font-size:20px;width:36px;height:36px;border-radius:9px;cursor:pointer}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar .tr{height:12px;background:var(--bg);border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px}
.bar b{white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:22px 8px}
.toast{position:fixed;inset-inline:16px;bottom:16px;max-width:528px;margin:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;transform:translateY(140%);transition:transform .25s}
.toast.show{transform:none}
.toast button{border:0;background:none;color:var(--coral);font:800 15px Cairo,sans-serif;min-height:40px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.modal .panel{max-width:420px;width:100%}
.setup{text-align:center}
.setup .big{color:var(--plum2)}
textarea{width:100%;min-height:90px;font:13px monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>مصروفي</span><button class="ghost" id="setBtn">الإعدادات</button></h1>

  <section id="setup" class="panel setup" hidden>
    <h2 style="margin-top:4px">معاك كام دلوقتي؟</h2>
    <p style="color:var(--mute);margin:0 0 10px">اكتب المبلغ اللي معاك، وكل مصروف هيتخصم منه.</p>
    <input id="startIn" type="number" inputmode="decimal" placeholder="مثلاً 1000" style="font-size:26px;text-align:center;font-weight:800">
    <button class="go" id="startBtn" style="background:var(--plum)">ابدأ</button>
  </section>

  <main id="app" hidden>
    <section class="hero">
      <small>الباقي معاك</small>
      <div class="big" id="left">0 <span>ج.م</span></div>
      <div class="meter"><i id="meter"></i></div>
      <small id="ofTotal"></small>
      <div class="stats">
        <div><small>صرفت النهارده</small><b id="today">0</b></div>
        <div><small>صرفت آخر 7 أيام</small><b id="week">0</b></div>
      </div>
    </section>

    <section class="panel">
      <div class="seg"><button id="mOut" class="on">صرفت</button><button id="mIn">دخل فلوس</button></div>
      <label for="amt">المبلغ</label>
      <input id="amt" type="number" inputmode="decimal" placeholder="0">
      <label for="note">على إيه؟</label>
      <input id="note" type="text" placeholder="مثلاً: غدا، أوبر، كارت شحن" maxlength="60">
      <div id="catBox"><label>النوع</label><div class="chips" id="chips"></div></div>
      <button class="go" id="addBtn">سجّل المصروف</button>
    </section>

    <h2>صرفت على إيه الشهر ده</h2>
    <div class="panel" id="cats" style="margin-top:0"></div>

    <h2>السجل</h2>
    <div id="list"></div>
  </main>
</div>

<div class="toast" id="toast"><span id="toastTx"></span><button id="undoBtn">تراجع</button></div>

<div class="modal" id="modal"><div class="panel">
  <h2 style="margin-top:0">الإعدادات</h2>
  <button class="ghost" id="copyBtn" style="width:100%">انسخ نسخة احتياطية</button>
  <label for="restore">أو الصق نسخة احتياطية هنا لاسترجاعها</label>
  <textarea id="restore"></textarea>
  <button class="ghost" id="restoreBtn" style="width:100%;margin-top:8px">استرجع</button>
  <button class="ghost" id="resetBtn" style="width:100%;margin-top:18px;color:var(--coral)">امسح كل حاجة وابدأ من جديد</button>
  <button class="go" id="closeBtn" style="background:var(--plum)">تمام</button>
</div></div>

<script>
{
const KEY='masrofi-v1';
const CATS=[['أكل','#ff8a3d'],['مواصلات','#3d8bff'],['قهوة وكافيهات','#a0612f'],['فواتير وشحن','#7a5af8'],['تسوق','#e5487d'],['تاني','#6c6778']];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n*100)/100;
const money=n=>fmt(n).toLocaleString('ar-EG');
let st={start:null,items:[]},mode='out',cat=0,lastDel=null,tm;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items))st=s}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function dayName(t){
  const k=dayKey(t),now=Date.now();
  if(k===dayKey(now))return 'النهارده';
  if(k===dayKey(now-864e5))return 'امبارح';
  return new Date(t).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
}

function render(){
  const ready=st.start!==null;
  $('setup').hidden=ready;$('app').hidden=!ready;
  if(!ready)return;
  const out=st.items.filter(i=>i.type==='out'),inn=st.items.filter(i=>i.type==='in');
  const sum=a=>a.reduce((s,i)=>s+i.amt,0);
  const total=st.start+sum(inn),left=total-sum(out);
  $('left').innerHTML=esc(money(left))+' <span>ج.م</span>';
  const pct=total>0?Math.max(0,Math.min(100,left/total*100)):0;
  $('meter').style.width=pct+'%';$('meter').className=pct<20?'low':'';
  $('ofTotal').textContent='من أصل '+money(total)+' ج.م · فاضل '+Math.round(pct)+'%';
  const tk=dayKey(Date.now());
  $('today').textContent=money(sum(out.filter(i=>dayKey(i.t)===tk)))+' ج.م';
  $('week').textContent=money(sum(out.filter(i=>i.t>Date.now()-7*864e5)))+' ج.م';

  // category bars for current month
  const m=new Date();const mo=out.filter(i=>{const d=new Date(i.t);return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()});
  const per=CATS.map((c,ix)=>({n:c[0],col:c[1],v:sum(mo.filter(i=>i.cat===ix))})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  const mx=per.length?per[0].v:1;
  $('cats').innerHTML=per.length?per.map(c=>`<div class="bar"><span>${esc(c.n)}</span><div class="tr"><i style="width:${c.v/mx*100}%;background:${c.col}"></i></div><b>${esc(money(c.v))}</b></div>`).join(''):'<div class="empty">لسه مفيش مصاريف الشهر ده</div>';

  // list grouped by day
  const items=[...st.items].sort((a,b)=>b.t-a.t);
  if(!items.length){$('list').innerHTML='<div class="empty">سجّل أول مصروف من فوق، وهيظهر هنا.</div>';return}
  const groups=[];items.forEach(i=>{const k=dayKey(i.t);let g=groups.find(g=>g.k===k);if(!g)groups.push(g={k,t:i.t,a:[]});g.a.push(i)});
  $('list').innerHTML=groups.map(g=>{
    const spent=sum(g.a.filter(i=>i.type==='out'));
    return `<div class="day"><div class="dayh"><span>${esc(dayName(g.t))}</span><span>صرفت ${esc(money(spent))} ج.م</span></div>`+
    g.a.map(i=>{
      const c=i.type==='in'?['دخل','#1f9e6e']:CATS[i.cat]||CATS[5];
      const time=new Date(i.t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
      return `<div class="row"><div class="ic" style="background:${c[1]}">${esc(c[0].charAt(0))}</div>
      <div class="t"><div>${esc(i.note||c[0])}</div><small>${esc(c[0])} · ${esc(time)}</small></div>
      <div class="a ${i.type}">${i.type==='out'?'−':'+'}${esc(money(i.amt))}</div>
      <button class="x" data-del="${esc(i.id)}" aria-label="امسح">×</button></div>`}).join('')+'</div>'}).join('');
}

function setMode(m){
  mode=m;$('mOut').classList.toggle('on',m==='out');$('mIn').classList.toggle('on',m==='in');
  $('catBox').hidden=m==='in';
  $('addBtn').textContent=m==='out'?'سجّل المصروف':'ضيف الفلوس';
  $('addBtn').classList.toggle('in',m==='in');
}
function drawChips(){$('chips').innerHTML=CATS.map((c,i)=>`<button data-cat="${i}" class="${i===cat?'on':''}">${esc(c[0])}</button>`).join('')}
function toast(t,undo){$('toastTx').textContent=t;$('undoBtn').hidden=!undo;$('toast').classList.add('show');clearTimeout(tm);tm=setTimeout(()=>$('toast').classList.remove('show'),4000)}

$('startBtn').onclick=()=>{const v=parseFloat($('startIn').value);if(!(v>=0)){$('startIn').focus();return}st={start:v,items:[]};save();render();$('amt').focus()};
$('mOut').onclick=()=>setMode('out');$('mIn').onclick=()=>setMode('in');
$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=+b.dataset.cat;drawChips()};
$('addBtn').onclick=()=>{
  const v=parseFloat($('amt').value);if(!(v>0)){$('amt').focus();return}
  st.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amt:v,note:$('note').value.trim(),cat:mode==='out'?cat:null,type:mode,t:Date.now()});
  save();$('amt').value='';$('note').value='';render();
  toast(mode==='out'?'اتخصم '+money(v)+' ج.م':'اتضاف '+money(v)+' ج.م',false);
  if(mode==='in')setMode('out');
};
$('amt').onkeydown=$('note').onkeydown=e=>{if(e.key==='Enter')$('addBtn').click()};
$('list').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;const ix=st.items.findIndex(i=>i.id===b.dataset.del);if(ix<0)return;lastDel=st.items.splice(ix,1)[0];save();render();toast('اتمسح',true)};
$('undoBtn').onclick=()=>{if(lastDel){st.items.push(lastDel);lastDel=null;save();render()}$('toast').classList.remove('show')};
$('setBtn').onclick=()=>{$('restore').value='';$('resetBtn').dataset.sure='';$('resetBtn').textContent='امسح كل حاجة وابدأ من جديد';$('modal').classList.add('show')};
$('closeBtn').onclick=()=>$('modal').classList.remove('show');
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(st));toast('اتنسخت، احفظها في الملاحظات',false)}catch(e){$('restore').value=JSON.stringify(st);toast('انسخ النص من المربع',false)}};
$('restoreBtn').onclick=()=>{try{const s=JSON.parse($('restore').value);if(typeof s.start!=='number'||!Array.isArray(s.items))throw 0;st=s;save();render();$('modal').classList.remove('show');toast('اترجعت البيانات',false)}catch(e){toast('النسخة دي مش سليمة',false)}};
$('resetBtn').onclick=()=>{const b=$('resetBtn');if(!b.dataset.sure){b.dataset.sure='1';b.textContent='متأكد؟ دوس تاني للمسح';return}st={start:null,items:[]};save();$('modal').classList.remove('show');render()};

load();drawChips();setMode('out');render();
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
